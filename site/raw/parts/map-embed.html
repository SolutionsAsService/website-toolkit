<style>
.sr-map{background:var(--sr-paper,#f4f0ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif);line-height:var(--sr-leading,1.55)}
.sr-map__in{max-width:var(--sr-max,1120px);margin:0 auto;padding:calc(var(--sr-space,16px)*3) var(--sr-space,16px);display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.sr-map iframe{display:block;width:100%;aspect-ratio:16/10;border:1px solid var(--sr-line,#c9bcf0);border-radius:var(--sr-radius,12px);background:var(--sr-surface,#e4daff)}
.sr-map h2{font:700 1.5rem/1.2 var(--sr-font-display,Georgia,serif);margin:0 0 10px}
.sr-map address{font-style:normal;margin:0 0 14px}
.sr-map a{color:var(--sr-accent,#5a2ee5);display:inline-block;padding:6px 0}
.sr-map a:focus-visible{outline:3px solid var(--sr-accent,#5a2ee5);outline-offset:2px}
@media (max-width:720px){.sr-map__in{grid-template-columns:minmax(0,1fr)}}
</style>
<section class="sr-map">
  <div class="sr-map__in">
    <iframe title="Map: Harbor &amp; Pine studio, Fremantle" loading="lazy" tabindex="-1" data-slot="bbox marker" src="https://www.openstreetmap.org/export/embed.html?bbox=115.7385%2C-32.0600%2C115.7565%2C-32.0490&amp;layer=mapnik&amp;marker=-32.0545%2C115.7475"></iframe>
    <div>
      <h2>Find us</h2>
      <address data-slot="address">Harbor &amp; Pine<br>14 Market Street<br>Fremantle WA 6160<br>Australia</address>
      <p style="margin:0 0 8px">Mon–Fri, 8:00–16:00</p>
      <a href="https://www.openstreetmap.org/?mlat=-32.0545&amp;mlon=115.7475#map=17/-32.0545/115.7475" data-slot="map-link">Open in OpenStreetMap</a>
    </div>
  </div>
</section>
