<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2 Breadcrumb</title>
<style>
/* sr:tokens */
/* website-toolkit tokens. Every part reads only these variables, so swapping this block re-themes every part.
   Copy this file (or the :root block) into any page that uses a part. Default theme: Signal. */
:root {
  --sr-ink: #15132b;          /* body text */
  --sr-muted: #4f4b6a;        /* secondary text, >= 4.5:1 on paper and surface */
  --sr-paper: #ebe3ff;        /* page background: lilac */
  --sr-surface: #dacbff;      /* cards, panels */
  --sr-line: #bfaef0;         /* hairlines, borders */
  --sr-accent: #5a2ee5;       /* links, primary buttons, focus */
  --sr-accent-ink: #ffffff;   /* text on the accent */
  --sr-radius: 12px;
  --sr-space: 16px;           /* base spacing unit */
  --sr-max: 1120px;           /* content width */
  --sr-measure: 65ch;         /* longest comfortable line of running text */
  --sr-leading: 1.55;         /* body line-height */
  --sr-font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sr-font-display: Georgia, "Times New Roman", serif;
  --sr-font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* /sr:tokens */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sr-paper,#ebe3ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif);line-height:var(--sr-leading,1.55)}
img{max-width:100%}
</style>
</head>
<body>
<!-- part A2 breadcrumb -->
<style>
.sr-crumb{font-family:var(--sr-font-body,system-ui,sans-serif);color:var(--sr-muted,#4f4b6a);background:var(--sr-paper,#ebe3ff)}
.sr-crumb ol{list-style:none;margin:0 auto;max-width:var(--sr-max,1120px);padding:12px var(--sr-space,16px);display:flex;flex-wrap:wrap;gap:4px}
.sr-crumb li+li::before{content:"/";margin:0 8px 0 4px;color:var(--sr-line,#bfaef0)}
.sr-crumb a{color:var(--sr-ink,#15132b);display:inline-block;padding:4px 0}
.sr-crumb a:focus-visible{outline:3px solid var(--sr-accent,#5a2ee5);outline-offset:2px;border-radius:3px}
.sr-crumb [aria-current]{color:var(--sr-ink,#15132b);font-weight:600;padding:4px 0}
</style>
<nav class="sr-crumb" aria-label="Breadcrumb">
  <ol>
    <li><a href="/" data-slot="crumb">Home</a></li>
    <li><a href="/services" data-slot="crumb">Services</a></li>
    <li><span aria-current="page" data-slot="current">Garden design</span></li>
  </ol>
</nav>
</body>
</html>
