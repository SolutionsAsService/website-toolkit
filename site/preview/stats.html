<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C3 Stat row</title>
<style>
/* sr:tokens */
/* website-toolkit tokens. Every part reads only these variables, so swapping this block re-themes every part.
   Copy this file (or the :root block) into any page that uses a part. Default theme: Signal. */
:root {
  --sr-ink: #15132b;          /* body text */
  --sr-muted: #4f4b6a;        /* secondary text, >= 4.5:1 on paper and surface */
  --sr-paper: #f4f0ff;        /* page background: lilac, not cream */
  --sr-surface: #e4daff;      /* cards, panels */
  --sr-line: #c9bcf0;         /* hairlines, borders */
  --sr-accent: #5a2ee5;       /* links, primary buttons, focus */
  --sr-accent-ink: #ffffff;   /* text on the accent */
  --sr-radius: 12px;
  --sr-space: 16px;           /* base spacing unit */
  --sr-max: 1120px;           /* content width */
  --sr-measure: 65ch;         /* longest comfortable line of running text */
  --sr-leading: 1.55;         /* body line-height */
  --sr-font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sr-font-display: Georgia, "Times New Roman", serif;
  --sr-font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* /sr:tokens */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sr-paper,#f4f0ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif);line-height:var(--sr-leading,1.55)}
img{max-width:100%}
</style>
</head>
<body>
<!-- part C3 stats -->
<style>
.sr-stats{background:var(--sr-paper,#f4f0ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif)}
.sr-stats dl{max-width:var(--sr-max,1120px);margin:0 auto;padding:calc(var(--sr-space,16px)*2.5) var(--sr-space,16px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:24px}
.sr-stats div{display:flex;flex-direction:column-reverse;border-left:3px solid var(--sr-accent,#5a2ee5);padding-left:14px}
.sr-stats dd{margin:0;font:700 clamp(2.2rem,5vw,3.2rem)/1 var(--sr-font-display,Georgia,serif);font-variant-numeric:tabular-nums}
.sr-stats dt{margin-top:6px;font-weight:600}
.sr-stats small{display:block;color:var(--sr-muted,#4f4b6a);font-size:.82rem;margin-top:2px}
</style>
<section class="sr-stats" aria-label="In numbers">
  <dl>
    <div data-slot="stat"><dt>gardens planted <small>our project log, 2014–2026</small></dt><dd>412</dd></div>
    <div data-slot="stat"><dt>less water than lawn <small>client meter readings, median of 38 sites</small></dt><dd>68%</dd></div>
    <div data-slot="stat"><dt>plants replaced in year one <small>care visits, 2025</small></dt><dd>3%</dd></div>
  </dl>
</section>
</body>
</html>
