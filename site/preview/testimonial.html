<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C4 Testimonial</title>
<style>
/* sr:tokens */
/* website-toolkit tokens. Every part reads only these variables, so swapping this block re-themes every part.
   Copy this file (or the :root block) into any page that uses a part. Default theme: Signal. */
:root {
  --sr-ink: #15132b;          /* body text */
  --sr-muted: #4f4b6a;        /* secondary text, >= 4.5:1 on paper and surface */
  --sr-paper: #f4f0ff;        /* page background: lilac, not cream */
  --sr-surface: #e4daff;      /* cards, panels */
  --sr-line: #c9bcf0;         /* hairlines, borders */
  --sr-accent: #5a2ee5;       /* links, primary buttons, focus */
  --sr-accent-ink: #ffffff;   /* text on the accent */
  --sr-radius: 12px;
  --sr-space: 16px;           /* base spacing unit */
  --sr-max: 1120px;           /* content width */
  --sr-measure: 65ch;         /* longest comfortable line of running text */
  --sr-leading: 1.55;         /* body line-height */
  --sr-font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sr-font-display: Georgia, "Times New Roman", serif;
  --sr-font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* /sr:tokens */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sr-paper,#f4f0ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif);line-height:var(--sr-leading,1.55)}
img{max-width:100%}
</style>
</head>
<body>
<!-- part C4 testimonial -->
<style>
.sr-quote{background:var(--sr-paper,#f4f0ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif)}
.sr-quote figure{max-width:46rem;margin:0 auto;padding:calc(var(--sr-space,16px)*3) var(--sr-space,16px)}
.sr-quote blockquote{margin:0;font:400 clamp(1.4rem,3vw,2rem)/1.35 var(--sr-font-display,Georgia,serif)}
.sr-quote blockquote p{margin:0}
.sr-quote blockquote p::before{content:"\201C";color:var(--sr-accent,#5a2ee5);margin-right:.05em}
.sr-quote blockquote p::after{content:"\201D";color:var(--sr-accent,#5a2ee5)}
.sr-quote figcaption{margin-top:18px;color:var(--sr-muted,#4f4b6a)}
.sr-quote figcaption b{color:var(--sr-ink,#15132b)}
</style>
<section class="sr-quote">
  <figure>
    <blockquote><p data-slot="quote">The garden we were sold was the garden we got, and it is better in the third summer than the first.</p></blockquote>
    <figcaption><b data-slot="name">Adaeze Okafor</b>, <span data-slot="role">homeowner, Ridge Road</span></figcaption>
  </figure>
</section>
</body>
</html>
