<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Navigation bar</title>
<style>
/* sr:tokens */
/* website-toolkit tokens. Every part reads only these variables, so swapping this block re-themes every part.
   Copy this file (or the :root block) into any page that uses a part. Default theme: Signal. */
:root {
  --sr-ink: #15132b;          /* body text */
  --sr-muted: #4f4b6a;        /* secondary text, >= 4.5:1 on paper and surface */
  --sr-paper: #f4f0ff;        /* page background: lilac, not cream */
  --sr-surface: #e4daff;      /* cards, panels */
  --sr-line: #c9bcf0;         /* hairlines, borders */
  --sr-accent: #5a2ee5;       /* links, primary buttons, focus */
  --sr-accent-ink: #ffffff;   /* text on the accent */
  --sr-radius: 12px;
  --sr-space: 16px;           /* base spacing unit */
  --sr-max: 1120px;           /* content width */
  --sr-measure: 65ch;         /* longest comfortable line of running text */
  --sr-leading: 1.55;         /* body line-height */
  --sr-font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sr-font-display: Georgia, "Times New Roman", serif;
  --sr-font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* /sr:tokens */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sr-paper,#f4f0ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif);line-height:var(--sr-leading,1.55)}
img{max-width:100%}
</style>
</head>
<body>
<!-- part A1 nav-bar -->
<style>
.sr-nav{background:var(--sr-paper,#f4f0ff);color:var(--sr-ink,#15132b);border-bottom:1px solid var(--sr-line,#c9bcf0);font-family:var(--sr-font-body,system-ui,sans-serif)}
.sr-nav__in{max-width:var(--sr-max,1120px);margin:0 auto;padding:12px var(--sr-space,16px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.sr-nav__brand{font:700 1.15rem/1 var(--sr-font-display,Georgia,serif);color:inherit;text-decoration:none;padding:6px 0}
.sr-nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px 22px;flex-wrap:wrap}
.sr-nav a{color:inherit}
.sr-nav ul a{display:inline-block;padding:8px 2px;text-decoration:none}
.sr-nav ul a:hover{text-decoration:underline}
.sr-nav ul a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--sr-accent,#5a2ee5);font-weight:600}
.sr-nav a:focus-visible,.sr-nav summary:focus-visible{outline:3px solid var(--sr-accent,#5a2ee5);outline-offset:2px;border-radius:3px}
.sr-nav details{display:none}
.sr-nav summary{cursor:pointer;list-style:none;padding:8px 12px;border:1px solid var(--sr-line,#c9bcf0);border-radius:var(--sr-radius,12px);font-weight:600}
.sr-nav summary::-webkit-details-marker{display:none}
@media (max-width:640px){
  .sr-nav__wide{display:none}
  .sr-nav details{display:block;position:relative}
  .sr-nav details ul{position:absolute;right:0;top:calc(100% + 6px);flex-direction:column;gap:0;min-width:200px;background:var(--sr-paper,#f4f0ff);border:1px solid var(--sr-line,#c9bcf0);border-radius:var(--sr-radius,12px);padding:6px 14px;z-index:5}
}
</style>
<header class="sr-nav">
  <div class="sr-nav__in">
    <a class="sr-nav__brand" href="/" data-slot="brand-href"><span data-slot="brand">Harbor &amp; Pine</span></a>
    <nav class="sr-nav__wide" aria-label="Main">
      <ul>
        <li><a href="/" aria-current="page" data-slot="link current">Home</a></li>
        <li><a href="/services" data-slot="link">Services</a></li>
        <li><a href="/about" data-slot="link">About</a></li>
        <li><a href="/contact" data-slot="link">Contact</a></li>
      </ul>
    </nav>
    <details>
      <summary>Menu</summary>
      <nav aria-label="Main (menu)">
        <ul>
          <li><a href="/" aria-current="page" data-slot="link current">Home</a></li>
          <li><a href="/services" data-slot="link">Services</a></li>
          <li><a href="/about" data-slot="link">About</a></li>
          <li><a href="/contact" data-slot="link">Contact</a></li>
        </ul>
      </nav>
    </details>
  </div>
</header>
</body>
</html>
