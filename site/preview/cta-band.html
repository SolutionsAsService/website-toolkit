<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C8 Call-to-action band</title>
<style>
/* sr:tokens */
/* website-toolkit tokens. Every part reads only these variables, so swapping this block re-themes every part.
   Copy this file (or the :root block) into any page that uses a part. Default theme: Signal. */
:root {
  --sr-ink: #15132b;          /* body text */
  --sr-muted: #4f4b6a;        /* secondary text, >= 4.5:1 on paper and surface */
  --sr-paper: #ebe3ff;        /* page background: lilac */
  --sr-surface: #dacbff;      /* cards, panels */
  --sr-line: #bfaef0;         /* hairlines, borders */
  --sr-accent: #5a2ee5;       /* links, primary buttons, focus */
  --sr-accent-ink: #ffffff;   /* text on the accent */
  --sr-radius: 12px;
  --sr-space: 16px;           /* base spacing unit */
  --sr-max: 1120px;           /* content width */
  --sr-measure: 65ch;         /* longest comfortable line of running text */
  --sr-leading: 1.55;         /* body line-height */
  --sr-font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sr-font-display: Georgia, "Times New Roman", serif;
  --sr-font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* /sr:tokens */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sr-paper,#ebe3ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif);line-height:var(--sr-leading,1.55)}
img{max-width:100%}
</style>
</head>
<body>
<!-- part C8 cta-band -->
<style>
.sr-cta{background:var(--sr-accent,#5a2ee5);color:var(--sr-accent-ink,#fff);font-family:var(--sr-font-body,system-ui,sans-serif)}
.sr-cta__in{max-width:var(--sr-max,1120px);margin:0 auto;padding:calc(var(--sr-space,16px)*2.5) var(--sr-space,16px);display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
.sr-cta p{margin:0;font:700 clamp(1.3rem,3vw,2rem)/1.2 var(--sr-font-display,Georgia,serif);max-width:28em}
.sr-cta a{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:var(--sr-radius,12px);background:var(--sr-accent-ink,#fff);color:var(--sr-accent,#5a2ee5);font-weight:700;text-decoration:none}
.sr-cta a:focus-visible{outline:3px solid var(--sr-accent-ink,#fff);outline-offset:3px}
</style>
<section class="sr-cta">
  <div class="sr-cta__in">
    <p data-slot="line">Autumn planting slots open in August.</p>
    <a href="/contact" data-slot="action">Ask for a visit</a>
  </div>
</section>
</body>
</html>
