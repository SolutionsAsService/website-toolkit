<style>
.sr-stats{background:var(--sr-paper,#fffdf8);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif)}
.sr-stats dl{max-width:var(--sr-max,1120px);margin:0 auto;padding:calc(var(--sr-space,16px)*2.5) var(--sr-space,16px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:24px}
.sr-stats div{display:flex;flex-direction:column-reverse;border-left:3px solid var(--sr-accent,#5a2ee5);padding-left:14px}
.sr-stats dd{margin:0;font:700 clamp(2.2rem,5vw,3.2rem)/1 var(--sr-font-display,Georgia,serif);font-variant-numeric:tabular-nums}
.sr-stats dt{margin-top:6px;font-weight:600}
.sr-stats small{display:block;color:var(--sr-muted,#4f4b6a);font-size:.82rem;margin-top:2px}
</style>
<section class="sr-stats" aria-label="In numbers">
  <dl>
    <div data-slot="stat"><dt>gardens planted <small>our project log, 2014–2026</small></dt><dd>412</dd></div>
    <div data-slot="stat"><dt>less water than lawn <small>client meter readings, median of 38 sites</small></dt><dd>68%</dd></div>
    <div data-slot="stat"><dt>plants replaced in year one <small>care visits, 2025</small></dt><dd>3%</dd></div>
  </dl>
</section>
