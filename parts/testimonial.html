<style>
.sr-quote{background:var(--sr-paper,#ebe3ff);color:var(--sr-ink,#15132b);font-family:var(--sr-font-body,system-ui,sans-serif)}

.sr-quote blockquote p::after{content:"\201D";color:var(--sr-accent,#5a2ee5)}

<section class="sr-quote">
